services:
  client:
    image: client-dev
    build:
      context: ./client
      dockerfile: .Dockerfile
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:8080/api

  nginx:
    image: nginx:1.25-alpine
    ports:
      - 8080:80
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server

  server:
    image: server-dev
    build:
      context: ./server
      dockerfile: .Dockerfile
    ports:
      - 3001:3001
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:mysecretpassword@host.docker.internal:54923/postgres
      - TEST_DATABASE_URL=postgres://postgres:mysecretpassword@host.docker.internal:54923/postgres
      - NODE_ENV=development
      - SECRET=supersecret
