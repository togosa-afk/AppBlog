name: Deployment pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test images
        run: docker compose -f docker-compose.yml build server client
      - name: Start test dependencies
        run: docker compose -f docker-compose.yml up -d mongo redis
      - name: Check style in containers
        run: |
          docker compose -f docker-compose.yml run --rm server npm run lint
          docker compose -f docker-compose.yml run --rm client npm run lint
      - name: Run tests in containers
        env:
          SECRET: ${{ secrets.SECRET }}
        run: |
          docker compose -f docker-compose.yml run --rm -e SECRET server npm test
          docker compose -f docker-compose.yml run --rm client npm test
      - name: Stop test containers
        if: always()
        run: docker compose -f docker-compose.yml down -v

  build:
    needs: [test]
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker compose -f docker-compose.yml build server client
      - name: Build client in its container
        run: docker compose -f docker-compose.yml run --rm client npm run build
      - name: Clean up build containers
        if: always()
        run: docker compose -f docker-compose.yml down -v

  deploy:
    needs: [build]
    if: ${{ needs.build.result == 'success' && github.event_name == 'push' && !contains(github.event.head_commit.message || '', '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment on Render
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  tag_release:
    needs: [deploy]
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message || '', '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify_discord:
    needs: [test, build, deploy, tag_release]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on Success
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'Success'
          title: 'Deployment Successful! 🚀'
          description: 'New version deployed to Render by ${{ github.actor }}.'
          color: 0x00ff00

      - name: Notify Discord on Failure
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'Failure'
          title: 'Pipeline Failed! 💥'
          description: "Commit '${{ github.event.head_commit.message }}' broke the build."
          color: 0xff0000
